<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Python game preview</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #101727;
        overflow: hidden;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        outline: none;
      }
      canvas:focus-visible {
        outline: 2px solid #8dccff;
        outline-offset: -2px;
      }
    </style>
  </head>
  <body>
    <canvas
      id="canvas"
      width="640"
      height="400"
      tabindex="0"
      aria-label="Game preview. Click to use the keyboard."
    ></canvas>
    <script type="module" src="./game-frame.mjs"></script>
  </body>
</html>
